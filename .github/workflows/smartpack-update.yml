name: Update SmartPack Metadata

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          TAG="${{ github.event.release.tag_name }}"

          VERSION="${TAG#v}"

          echo "version=${VERSION}"                                        >> "$GITHUB_OUTPUT"
          echo "release_url=${{ github.event.release.html_url }}"         >> "$GITHUB_OUTPUT"
          echo "repo_url=https://github.com/${{ github.repository }}"     >> "$GITHUB_OUTPUT"

          CHANGELOG_URL=$(printf '%s' "$RELEASE_BODY" \
            | grep -oP 'https?://[^\s)\]"<>]+' \
            | head -1)
          CHANGELOG_URL="${CHANGELOG_URL:-${{ github.event.release.html_url }}}"

          echo "changelog_url=${CHANGELOG_URL}" >> "$GITHUB_OUTPUT"

      - name: Download artifact and compute SHA1
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ARTIFACT="VanillaKernel-${VERSION}.zip"

          echo "Looking for asset: ${ARTIFACT}"

          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "${ARTIFACT}" \
            --dir /tmp

          SHA1=$(sha1sum "/tmp/${ARTIFACT}" | awk '{print $1}')
          echo "sha1=${SHA1}" >> "$GITHUB_OUTPUT"
          echo "SHA1: ${SHA1}"

      - name: Update smartpack/update.json
        run: |
          jq \
            --arg version      "${{ steps.vars.outputs.version }}"       \
            --arg link         "${{ steps.vars.outputs.release_url }}"   \
            --arg changelog    "${{ steps.vars.outputs.changelog_url }}" \
            --arg sha1         "${{ steps.asset.outputs.sha1 }}"         \
            --arg support_link "${{ steps.vars.outputs.repo_url }}"      \
            '
              .kernel.version       = $version      |
              .kernel.link          = $link          |
              .kernel.changelog_url = $changelog     |
              .kernel.sha1          = $sha1          |
              .support.link         = $support_link
            ' smartpack/update.json > /tmp/update.json

          mv /tmp/update.json smartpack/update.json

          echo "=== smartpack/update.json after update ==="
          cat smartpack/update.json

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add smartpack/update.json

          if git diff --staged --quiet; then
            echo "update.json is already up-to-date, nothing to commit."
          else
            git commit -m "chore: update smartpack/update.json for release ${{ github.event.release.tag_name }}"
            git push
          fi
