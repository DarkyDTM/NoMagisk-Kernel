name: Build Kernel
on:
  push:
    branches: [ lineage-23.2-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch submodule history
        run: git submodule foreach --recursive 'git fetch --unshallow || true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            make python3 ccache zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/ndk
          key: android-ndk-r27d

      - name: Download NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/ndk
          wget -q \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" \
            -O ndk.zip
          unzip -q ndk.zip -d $HOME/ndk

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Set toolchain path
        run: echo "CLANG_BIN=$HOME/ndk/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Make defconfig
        run: |
          export PATH="$CLANG_BIN:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=$CLANG_BIN/clang \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/lahaina-qgki_defconfig

      - name: Build kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export CCACHE_DIR=~/.ccache
          ccache -M 5G
          ccache -z
          make O=out \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="ccache $CLANG_BIN/clang" \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc) Image.gz 2>&1 | tee build.log
          ccache -s

      - name: Prepare AnyKernel3 Folder & Generate Zip
        if: success()
        run: |
          cp out/arch/arm64/boot/Image.gz tools/anykernel3/
          rm -rf tools/anykernel3/.git
          rm -f tools/anykernel3/*.zip
          cd tools/anykernel3
          zip -r9 ../../Kernel-build-${{ github.sha }}.zip ./*

      - name: Upload Kernel Artifact to GitHub
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoMagiskKernel
          path: Kernel-build-${{ github.sha }}.zip
          compression-level: 9

      - name: Upload Build Log to GitHub
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Send Telegram Notification (Success)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          REPO_URL="https://github.com/${{ github.repository }}"
          
          CAPTION="✅ <b>Kernel Build Successful!</b>
          
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>"
          
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
            -F chat_id="$CHAT_ID" \
            -F document="@Kernel-build-${{ github.sha }}.zip" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"

      - name: Send Telegram Notification (Failure)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
        run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          REPO_URL="https://github.com/${{ github.repository }}"
          
          CAPTION="❌ <b>Kernel Build Failed!</b>
          
          📅 <b>Date:</b> $DATE
          📝 <b>Commit:</b> <code>$COMMIT_MSG</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>"
          
          if [ -f build.log ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document="@build.log" \
              -F caption="$CAPTION
              
          The error log is attached to this message." \
              -F parse_mode="HTML"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$CAPTION
              
          <i>The error log was not created (the error likely occurred before compilation).</i>" \
              -d parse_mode="HTML"
          fi
