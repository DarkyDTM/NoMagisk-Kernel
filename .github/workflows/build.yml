name: Build Kernel
on:
  push:
    branches: [ lineage-23.2, lineage-23.2-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      CCACHE_DIR: /home/runner/.ccache
      ARTIFACT: VanillaKernel-${{ github.sha }}.zip
      CLANG_VERSION: clang-r416183b
      CLANG_COMMIT: b669748458572622ed716407611633c5415da25c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize environment
        run: |
          git submodule foreach --recursive 'git fetch --unshallow || true'
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make python3 ccache zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu rsync

      - uses: actions/cache@v4
        id: cache-clang
        with:
          path: ~/clang
          key: ${{ env.CLANG_VERSION }}-${{ env.CLANG_COMMIT }}

      - name: Fetch Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/${CLANG_VERSION}.tar.gz" | tar -xz -C ~/clang

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Prepare build
        run: |
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          chmod +x tools/build.sh
          ccache -M 5G

      - name: Build config
        run: |
          set -o pipefail
          ./tools/build.sh config vendor/lahaina-qgki_defconfig arch/arm64/configs/vanillaKernel-defconfig 2>&1 | tee build.log

      - name: Build kernel
        run: |
          set -o pipefail
          ./tools/build.sh kernel 2>&1 | tee -a build.log
          ccache -s

      - name: Pack release
        if: success()
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"
          if [ ! -f "$IMAGE" ]; then
            echo "::error::Kernel image not found at $IMAGE - build did not produce an output."
            exit 1
          fi
          cp "$IMAGE" tools/anykernel3/
          cd tools/anykernel3
          rm -rf .git *.zip
          zip -r9 "../../$ARTIFACT" ./*

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VanillaKernel
          path: ${{ env.ARTIFACT }}
          compression-level: 9

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          DURATION=$(( $(date +%s) - START_TIME ))
          MINS=$(( DURATION / 60 ))
          SECS=$(( DURATION % 60 ))

          # Escape HTML special chars so parse_mode=HTML never breaks on the commit subject
          COMMIT_MSG_HTML=$(printf '%s' "$COMMIT_MSG" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            STATE="Successful"
            DOC="-F document=@$ARTIFACT"
            EXTRA=""
          else
            ICON="❌"
            STATE="Failed"
            if [ -f build.log ]; then
              DOC="-F document=@build.log"
              EXTRA=$'\n\nError log attached.'
            else
              DOC=""
              EXTRA=$'\n\n<i>Log missing - failed before compilation.</i>'
            fi
          fi

          CAPTION="$ICON <b>Kernel Build $STATE!</b>

          🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>
          ⏱ <b>Time:</b> ${MINS}m ${SECS}s
          📝 <b>Commit:</b> <code>$COMMIT_MSG_HTML</code>
          🔢 <b>Hash:</b> <a href=\"$REPO_URL/commit/${{ github.sha }}\">$COMMIT_HASH</a>$EXTRA"

          if [ -n "$DOC" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              $DOC \
              -F caption="$CAPTION" \
              -F parse_mode="HTML"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" \
              -d text="$CAPTION" \
              -d parse_mode="HTML"
          fi
